<title>Babar Handcarwash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500;62..125,700;62..125,800;62..125,900&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: mobile-first app shell — sticky header, single content column (max 1080px), fixed bottom tab bar on phones. */
:root {
  --ink: #0d0e10;        /* page */
  --panel: #16181b;      /* cards */
  --raised: #1f2226;     /* inputs, hover */
  --line: #2c3035;       /* borders */
  --fg: #f2f2ef;         /* text */
  --muted: #9aa0a6;      /* secondary text */
  --amber: #ffc53d;      /* the single accent */
  --amber-ink: #1b1400;  /* text on accent */
  --ok: #57d68d; --warn: #f5b942; --bad: #ff7a72; --info: #7cc4ff;
  --display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 18px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--ink); color: var(--fg); }
body { font-family: var(--body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; min-height: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 50; background: var(--ink); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.banner { background: var(--amber); color: var(--amber-ink); font-size: 12px; font-weight: 700; text-align: center; padding-block: 6px; }
.banner .wrap { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: color-mix(in srgb, var(--ink) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; justify-content: space-between; height: 60px; gap: 16px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.mark { width: 32px; height: 32px; border-radius: 9px; background: var(--amber); color: var(--amber-ink); display: grid; place-items: center; font-family: var(--display); font-weight: 900; font-size: 19px; }
.brand b { font-family: var(--display); font-weight: 800; font-size: 18px; letter-spacing: -0.01em; font-stretch: 90%; }
nav.desk { display: none; align-items: center; gap: 22px; font-size: 14px; color: var(--muted); }
nav.desk a { text-decoration: none; }
nav.desk a:hover, nav.desk a[aria-current] { color: var(--fg); }
@media (min-width: 820px) { nav.desk { display: flex; } }
main { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 820px) { main { padding-bottom: 48px; } }
nav.tabs { position: fixed; inset: auto 0 0; z-index: 40; background: color-mix(in srgb, var(--ink) 95%, transparent); backdrop-filter: blur(8px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav.tabs ul { list-style: none; margin: 0 auto; padding: 0; max-width: 480px; display: grid; grid-template-columns: repeat(4, 1fr); }
nav.tabs a { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 0 7px; font-size: 11px; font-weight: 600; color: var(--muted); text-decoration: none; }
nav.tabs a[aria-current] { color: var(--amber); }
nav.tabs svg { width: 24px; height: 24px; }
@media (min-width: 820px) { nav.tabs { display: none; } }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

h1, h2, h3 { font-family: var(--display); font-stretch: 88%; letter-spacing: -0.015em; text-wrap: balance; margin: 0; }
.eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--amber); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 20px; border-radius: 999px; border: 1px solid var(--line); background: transparent; font-weight: 700; cursor: pointer; text-decoration: none; transition: background .15s, border-color .15s; white-space: nowrap; }
.btn:hover { background: var(--raised); }
.btn.primary { background: var(--amber); border-color: var(--amber); color: var(--amber-ink); }
.btn.primary:hover { background: #ffd36b; }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
.btn.sm { height: 36px; padding: 0 14px; font-size: 13.5px; }
.btn.lg { height: 56px; padding: 0 28px; font-size: 16px; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
.field { display: block; width: 100%; height: 48px; padding: 0 14px; border-radius: 12px; background: var(--raised); border: 1px solid var(--line); }
textarea.field { height: auto; padding: 12px 14px; resize: vertical; }
.field:focus { outline: none; border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber); }
label.lbl { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
.chip { display: inline-flex; align-items: center; height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); font-size: 13px; color: var(--muted); text-decoration: none; white-space: nowrap; }
.pill { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.st-nieuw { background: color-mix(in srgb, var(--amber) 16%, transparent); color: var(--amber); }
.st-in_behandeling { background: color-mix(in srgb, var(--info) 16%, transparent); color: var(--info); }
.st-bevestigd { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.st-afgerond { background: color-mix(in srgb, var(--fg) 10%, transparent); color: var(--muted); }
.st-afgewezen, .st-geannuleerd { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
.notice { border-radius: 12px; padding: 12px 16px; font-size: 14px; border: 1px solid var(--line); }
.notice.err { border-color: color-mix(in srgb, var(--bad) 45%, transparent); background: color-mix(in srgb, var(--bad) 10%, transparent); }
.notice.ok { border-color: color-mix(in srgb, var(--ok) 35%, transparent); background: color-mix(in srgb, var(--ok) 9%, transparent); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.grid { display: grid; gap: 16px; }
@media (min-width: 720px) { .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
section.blk { padding-block: 44px; }
.rise { animation: rise .35s cubic-bezier(.2,.7,.2,1) both; }
@keyframes rise { from { opacity: .001; transform: translateY(8px); } }
@media (prefers-reduced-motion: reduce) { .rise { animation: none; } * { transition: none !important; } }

/* hero */
.hero { border-bottom: 1px solid var(--line); }
.hero .wrap { display: grid; gap: 32px; padding-block: 44px 52px; }
@media (min-width: 820px) { .hero .wrap { grid-template-columns: 1.25fr 1fr; align-items: end; padding-block: 72px 76px; } }
.hero h1 { font-size: clamp(44px, 11vw, 92px); font-weight: 900; line-height: .92; font-stretch: 78%; text-transform: uppercase; margin-top: 14px; }
.hero h1 em { font-style: normal; color: var(--amber); }
.hero p.lead { font-size: 17px; color: var(--muted); max-width: 30em; margin: 18px 0 0; }
.ticket { position: relative; padding: 22px; }
.ticket .big { font-family: var(--display); font-weight: 900; font-size: 64px; line-height: 1; color: var(--amber); font-stretch: 80%; }
.ticket dl { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; margin: 18px 0 0; font-size: 14px; }
.ticket dt { color: var(--muted); } .ticket dd { margin: 0; font-weight: 600; text-align: right; }
.ticket::after { content: ""; position: absolute; left: 22px; right: 22px; top: 112px; border-top: 1px dashed var(--line); }

/* services */
.svc { display: flex; flex-direction: column; overflow: hidden; }
.svc .ph { aspect-ratio: 16/9; max-width: 100%; background: var(--raised); display: flex; align-items: flex-end; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid var(--line); position: relative; }
.svc .ph span.cat { font-family: var(--display); font-weight: 700; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.svc .ph .drop { width: 46px; height: 46px; color: var(--line); }
.svc .ph .pop { position: absolute; top: 14px; left: 14px; background: var(--ink); color: var(--amber); font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
.svc .bd { padding: 18px; display: flex; flex-direction: column; gap: 14px; flex: 1; }
.svc h3 { font-size: 22px; font-weight: 800; }
.svc p { margin: 6px 0 0; color: var(--muted); }
.prices { border: 1px solid var(--line); border-radius: 12px; margin-top: auto; }
.prices div { display: flex; justify-content: space-between; align-items: center; padding: 9px 14px; font-size: 14px; gap: 10px; }
.prices div + div { border-top: 1px solid var(--line); }
.prices b { font-family: var(--display); font-size: 17px; min-width: 52px; text-align: right; }
.benefits { list-style: none; padding: 0; margin: 28px 0 0; display: grid; gap: 26px; }
@media (min-width: 720px) { .benefits { grid-template-columns: repeat(4, 1fr); } }
.benefits h3 { font-size: 18px; margin: 12px 0 4px; }
.benefits p { margin: 0; color: var(--muted); }
.hours li { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--line); color: var(--muted); }
.hours li.today { color: var(--fg); font-weight: 600; }
.hours { list-style: none; margin: 0; padding: 0; }

/* wizard */
.steps { display: flex; gap: 6px; flex: 1; }
.steps i { height: 5px; flex: 1; border-radius: 9px; background: var(--line); }
.steps i.on { background: var(--amber); }
.seg { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 6px; padding: 6px; border-radius: 16px; background: var(--panel); }
.seg button { height: 44px; border-radius: 11px; border: 0; background: transparent; font-weight: 700; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--ink); }
.opt { display: flex; align-items: center; gap: 14px; padding: 15px 16px; text-align: left; width: 100%; cursor: pointer; background: var(--panel); }
.opt[aria-pressed="true"] { border-color: var(--amber); background: color-mix(in srgb, var(--amber) 6%, var(--panel)); }
.opt[disabled] { opacity: .4; cursor: default; }
.radio { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); flex: none; display: grid; place-items: center; }
.opt[aria-pressed="true"] .radio { background: var(--amber); border-color: var(--amber); color: var(--amber-ink); }
.days { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x mandatory; margin-inline: -16px; padding-inline: 16px; }
.day { flex: none; width: 64px; padding: 10px 0; border-radius: 16px; border: 1px solid var(--line); background: transparent; cursor: pointer; display: flex; flex-direction: column; align-items: center; scroll-snap-align: start; }
.day b { font-family: var(--display); font-size: 24px; line-height: 1.1; }
.day span { font-size: 12px; }
.day[aria-selected="true"] { background: var(--amber); border-color: var(--amber); color: var(--amber-ink); }
.day[disabled] { opacity: .28; cursor: default; }
.times { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.time { height: 48px; border-radius: 12px; border: 1px solid var(--line); background: transparent; font-weight: 700; cursor: pointer; font-variant-numeric: tabular-nums; }
.time[aria-selected="true"] { background: var(--amber); border-color: var(--amber); color: var(--amber-ink); }
.bar { position: fixed; inset: auto 0 0; z-index: 45; background: color-mix(in srgb, var(--ink) 96%, transparent); backdrop-filter: blur(8px); border-top: 1px solid var(--line); padding-bottom: max(10px, env(safe-area-inset-bottom, 0px)); }
.bar .wrap { max-width: 720px; display: flex; align-items: center; gap: 14px; padding-top: 10px; }
.bar .sum { flex: 1; min-width: 0; font-size: 14px; }
.bar .sum p { margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kv { display: flex; justify-content: space-between; gap: 18px; padding: 12px 18px; }
.kv + .kv { border-top: 1px solid var(--line); }
.kv span:last-child { text-align: right; font-weight: 600; }
.round { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; background: transparent; cursor: pointer; flex: none; }

/* admin */
.atabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); margin-bottom: 22px; }
.atabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 12px 12px; color: var(--muted); font-weight: 600; cursor: pointer; white-space: nowrap; }
.atabs button[aria-current] { color: var(--fg); border-bottom-color: var(--amber); }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 820px) { .tiles { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
.tile { padding: 14px 16px; text-align: left; cursor: pointer; }
.tile b { display: block; font-family: var(--display); font-size: 36px; font-weight: 900; line-height: 1; }
.tile.hot { border-color: color-mix(in srgb, var(--amber) 60%, transparent); }
.tile.hot b { color: var(--amber); }
.list { list-style: none; margin: 0; padding: 0; overflow: hidden; }
.list li + li { border-top: 1px solid var(--line); }
.list button.item { display: flex; align-items: center; gap: 14px; width: 100%; padding: 12px 16px; background: none; border: 0; text-align: left; cursor: pointer; }
.list button.item:hover { background: var(--raised); }
.when { width: 64px; text-align: center; flex: none; }
.when b { display: block; font-family: var(--display); font-size: 18px; }
.when span { font-size: 12px; color: var(--muted); }
.grow { flex: 1; min-width: 0; }
.ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tbl-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 560px; }
.tbl th, .tbl td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl th { color: var(--muted); font-weight: 600; font-size: 13px; }
.tbl input.field { height: 40px; }
.switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px; }
.switch input { width: 20px; height: 20px; accent-color: var(--amber); }
.pad { padding: 18px; }
@media (min-width: 720px) { .pad { padding: 22px; } }
footer.foot { border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
footer.foot .wrap { display: flex; flex-wrap: wrap; gap: 12px 24px; justify-content: space-between; padding-block: 24px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--fg); color: var(--ink); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; max-width: calc(100% - 32px); }
.confirm-box { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
</style>

</head>

<div id="app"></div>

<script>
(() => {
'use strict';

/* ------------------------------------------------------------ demo defaults
   Used to fill an empty local demo. All values are examples to be confirmed
   with the owner; the banner says so while demo mode is on. */
const DEFAULT_CONFIG = {
  business: { name: 'Babar Handcarwash', tagline: 'Jouw wagen, onze zorg.', address: '', postal: '', city: '', phone: '', whatsapp: '', email: '', instagram: '', demo: true },
  vehicles: [ { id: 'car', name: 'Personenwagen', active: true }, { id: 'suv', name: 'SUV', active: true }, { id: 'van', name: 'Bestelwagen', active: true } ],
  services: [
    { id: 's1', name: 'Buitenwas', category: 'Buitenwas', popular: true, active: true, description: 'Volledige handwas van de carrosserie met pH-neutrale shampoo, velgen en banden gereinigd, met de hand drooggemaakt.', prices: { car: [2500, 30], suv: [3000, 40], van: [3500, 50] } },
    { id: 's2', name: 'Binnenreiniging', category: 'Binnenreiniging', popular: false, active: true, description: 'Stofzuigen van zetels, vloer en koffer, dashboard en deurpanelen afgenomen, ruiten binnenkant gereinigd.', prices: { car: [3000, 45], suv: [3500, 50], van: [4000, 60] } },
    { id: 's3', name: 'Binnen + buiten', category: 'Binnen + buiten', popular: true, active: true, description: 'De complete beurt: handwas buiten en grondige reiniging binnen in één afspraak.', prices: { car: [5000, 75], suv: [6000, 90], van: [7000, 105] } },
    { id: 's4', name: 'Dieptereiniging', category: 'Dieptereiniging', popular: true, active: true, description: 'Shampooneren van zetels en tapijten, vlekken behandelen en kunststof verzorgen. Ideaal bij verkoop of na de winter.', prices: { car: [12000, 180], suv: [14000, 210], van: [16000, 240] } },
    { id: 's5', name: 'Velgen & banden', category: 'Extra diensten', popular: false, active: true, description: 'Extra grondige reiniging van velgen met velgenreiniger en bandenzwart.', prices: { car: [1500, 20], suv: [1800, 20], van: [1800, 20] } },
    { id: 's6', name: 'Wax-behandeling', category: 'Extra diensten', popular: false, active: true, description: 'Beschermende waxlaag met de hand aangebracht voor extra glans en waterafstoting.', prices: { car: [2500, 30], suv: [3000, 40] } }
  ],
  hours: { 1: [true, '09:00', '18:00'], 2: [true, '09:00', '18:00'], 3: [true, '09:00', '18:00'], 4: [true, '09:00', '18:00'], 5: [true, '09:00', '18:00'], 6: [true, '09:00', '17:00'], 7: [false, '09:00', '17:00'] },
  rules: { slot: 30, buffer: 10, capacity: 2, lead: 60, maxDays: 30 },
  blocks: [],
  promos: [ { id: 'p1', title: 'Winterklaar', description: 'Binnen + buiten met gratis velgenreiniging. Voorbeeldactie voor de demo.', label: 'Velgen gratis', code: 'WINTER', from: '', until: '', active: true, home: true } ]
};

/* ------------------------------------------------------------ time & money (Europe/Brussels) */
const TZ = 'Europe/Brussels';
const fmt = (o) => new Intl.DateTimeFormat('nl-BE', Object.assign({ timeZone: TZ }, o));
const ymd = (d = new Date()) => new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
const hm = (d) => new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(d);
function tzOffsetMin(at) {
  const p = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' }).formatToParts(at);
  const g = (t) => +p.find((x) => x.type === t).value;
  return Math.round((Date.UTC(g('year'), g('month') - 1, g('day'), g('hour'), g('minute'), g('second')) - at.getTime()) / 60000);
}
function toMs(date, time) {
  const [y, mo, d] = date.split('-').map(Number); const [h, mi] = time.split(':').map(Number);
  const guess = Date.UTC(y, mo - 1, d, h, mi);
  let ts = guess - tzOffsetMin(new Date(guess)) * 60000;
  return guess - tzOffsetMin(new Date(ts)) * 60000;
}
const addDays = (date, n) => { const [y, m, d] = date.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10); };
const isoDow = (date) => { const [y, m, d] = date.split('-').map(Number); const w = new Date(Date.UTC(y, m - 1, d)).getUTCDay(); return w === 0 ? 7 : w; };
const minOf = (t) => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const tOf = (m) => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
const euro = (c) => new Intl.NumberFormat('nl-BE', { style: 'currency', currency: 'EUR', minimumFractionDigits: c % 100 ? 2 : 0 }).format(c / 100);
const dur = (m) => m < 60 ? m + ' min' : (m % 60 ? Math.floor(m / 60) + ' u ' + (m % 60) + ' min' : m / 60 + ' u');
const dLong = (ms) => fmt({ weekday: 'long', day: 'numeric', month: 'long' }).format(new Date(ms));
const dShort = (ms) => fmt({ weekday: 'short', day: 'numeric', month: 'short' }).format(new Date(ms)).replace(/\./g, '');

const WEEKDAYS = ['Maandag', 'Dinsdag', 'Woensdag', 'Donderdag', 'Vrijdag', 'Zaterdag', 'Zondag'];

/* ------------------------------------------------------------ availability (same rules as the Supabase version) */
function slotProblem(cfg, slots, startMs, minutes, excludeId, enforceLead) {
  const R = cfg.rules; const date = ymd(new Date(startMs)); const local = hm(new Date(startMs));
  const endMs = startMs + minutes * 60000; const blockMs = endMs + R.buffer * 60000;
  if (enforceLead) {
    if (startMs < Date.now() + R.lead * 60000) return 'past';
    if (date > addDays(ymd(), R.maxDays)) return 'far';
  }
  const h = cfg.hours[isoDow(date)];
  if (!h || !h[0]) return 'closed';
  if (minOf(local) < minOf(h[1]) || ymd(new Date(endMs)) !== date || minOf(hm(new Date(endMs))) > minOf(h[2])) return 'hours';
  if ((cfg.blocks || []).some((b) => b.start < endMs && b.end > startMs)) return 'blocked';
  const active = slots.filter((s) => ACTIVE(s.status) && s.id !== excludeId);
  const points = [startMs, ...active.filter((s) => s.startMs > startMs && s.startMs < blockMs).map((s) => s.startMs)];
  for (const p of points) if (active.filter((s) => s.startMs <= p && s.blockMs > p).length >= R.capacity) return 'full';
  return null;
}
function freeTimes(cfg, slots, date, minutes) {
  const h = cfg.hours[isoDow(date)]; if (!h || !h[0]) return [];
  const out = [];
  for (let m = minOf(h[1]); m + minutes <= minOf(h[2]); m += cfg.rules.slot) {
    const ms = toMs(date, tOf(m));
    if (!slotProblem(cfg, slots, ms, minutes, null, true)) out.push({ ms, label: tOf(m) });
  }
  return out;
}

function localState() {
  const v = lsRead() || {};
  if (!v.cfg) v.cfg = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
  v.slots = v.slots || []; v.pii = v.pii || {}; v.mine = v.mine || [];
  return v;
}
function saveLocal() { lsWrite({ cfg: S.cfg, slots: S.slots, pii: S.pii, mine: S.mine }); }

const Store = {
  async saveConfig(cfg) {
    S.cfg = cfg;
    if (S.mode === 'remote') await S.db.doc('config/main').set(cfg); else saveLocal();
  },
  async createBooking(b, pii) {
    if (S.mode === 'remote') {
      const lock = S.db.doc('locks/booking'); let got = false;
      for (let i = 0; i < 8 && !got; i++) {
        try { got = (await lock.acquire({ holder: S.me + ':' + b.id, ttlMs: 8000 })).acquired; } catch { got = false; }
        if (!got) await new Promise((r) => setTimeout(r, 500 + Math.random() * 400));
      }
      if (!got) return 'busy';
      // re-read that day's bookings under the lease, then check again
      const day = ymd(new Date(b.startMs));
      const snap = await S.db.collection('slots').where('startMs', '>=', toMs(day, '00:00')).where('startMs', '<', toMs(addDays(day, 1), '00:00')).get();
      const fresh = snap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
      const p = slotProblem(S.cfg, fresh, b.startMs, b.minutes, null, true);
      if (p) return p;
      await S.db.doc('slots/' + b.id).set(b);
      await S.db.doc('requests/' + S.me + '/items/' + b.id).set(Object.assign({ booking: b.id, createdMs: b.createdMs }, pii));
      return null;
    }
    const p = slotProblem(S.cfg, S.slots, b.startMs, b.minutes, null, true);
    if (p) return p;
    S.slots.push(b); S.pii[b.id] = pii; S.mine.push(b.id); saveLocal();
    return null;
  },
  async updateSlot(id, patch) {
    const s = S.slots.find((x) => x.id === id); Object.assign(s, patch);
    if (S.mode === 'remote') await S.db.doc('slots/' + id).update(patch); else saveLocal();
  },
  async loadPii(slot) {
    if (S.pii[slot.id]) return S.pii[slot.id];
    if (S.mode !== 'remote' || !slot.owner) return null;
    const d = await S.db.doc('requests/' + slot.owner + '/items/' + slot.id).get();
    S.pii[slot.id] = d.exists ? d.data() : { missing: true };
    return S.pii[slot.id];
  },
  async savePii(slot, patch) {
    S.pii[slot.id] = Object.assign({}, S.pii[slot.id], patch);
    if (S.mode === 'remote') await S.db.doc('requests/' + slot.owner + '/items/' + slot.id).update(patch); else saveLocal();
  }
};

async function boot() {
  let db = null, user = null;
  try { [db, user] = await Promise.all([window.claude?.use?.('db'), window.claude?.use?.('user')]); } catch {}
  let canWrite = null;
  try { canWrite = user ? await user.can('data.write') : null; } catch {}
  if (db && user && canWrite !== false) {
    S.db = db; S.mode = 'remote';
    try { S.me = await user.id(); S.admin = await user.canEdit(); } catch {}
    const timer = setTimeout(() => { S.stale = true; render(); }, 10000);
    db.doc('config/main').onSnapshot((d) => {
      clearTimeout(timer); S.stale = false;
      if (d.exists) { S.cfg = d.data(); S.cfgMissing = false; } else { S.cfgMissing = true; S.cfg = S.cfg || JSON.parse(JSON.stringify(DEFAULT_CONFIG)); }
      render();
    }, () => { clearTimeout(timer); S.stale = true; render(); });
    db.collection('slots').where('startMs', '>=', Date.now() - 90 * 864e5).orderBy('startMs').limit(1000).onSnapshot((q) => {
      S.slots = q.docs.map((d) => Object.assign({ id: d.id }, d.data())); render();
    }, () => {});
    if (S.me) db.collection('requests/' + S.me + '/items').onSnapshot((q) => {
      S.mine = q.docs.map((d) => d.id); render();
    }, () => {});
  } else {
    S.mode = 'local'; S.admin = true;
    const v = localState(); S.cfg = v.cfg; S.slots = v.slots; S.pii = v.pii; S.mine = v.mine;
  }
  render();
}

async function sendBooking() {
  const w = S.wiz; if (w.sending) return;
  if (w.form.website || Date.now() - w.opened < 3000) { w.err = 'Er ging iets mis. Probeer opnieuw.'; render(); return; }
  const svc = cfg().services.find((s) => s.id === w.sid); const pr = priceOf(svc, w.vid); const v = cfg().vehicles.find((x) => x.id === w.vid);
  const mineOpen = S.slots.filter((s) => S.mine.includes(s.id) && ACTIVE(s.status) && s.startMs > Date.now()).length;
  if (mineOpen >= 3) { w.err = 'Je hebt al drie open aanvragen. Neem contact op als je iets wil wijzigen.'; render(); return; }
  w.sending = true; w.err = ''; render();
  const id = uid();
  const b = { id, ref: newRef(), service: svc.name, vehicle: v.name, price: pr[0], minutes: pr[1], startMs: w.ms, endMs: w.ms + pr[1] * 60000, blockMs: w.ms + (pr[1] + cfg().rules.buffer) * 60000, status: 'nieuw', owner: S.me || 'local', createdMs: Date.now(), log: [{ to: 'nieuw', at: Date.now() }] };
  let phone = w.form.phone.replace(/[^\d+]/g, ''); if (phone.startsWith('00')) phone = '+' + phone.slice(2); else if (phone.startsWith('0')) phone = '+32' + phone.slice(1);
  const pii = { name: w.form.name.trim(), phone, email: w.form.email.trim().toLowerCase(), plate: w.form.plate.replace(/\s/g, '').toUpperCase(), comment: w.form.comment.trim(), notes: '' };
  let problem;
  try { problem = await Store.createBooking(b, pii); } catch (e) { problem = 'busy'; }
  w.sending = false;
  if (problem) { w.err = ERR[problem] || ERR.busy; if (['full', 'past', 'blocked', 'hours', 'closed'].includes(problem)) { w.step = 2; w.ms = null; } render(); return; }
  if (!S.slots.some((s) => s.id === id)) S.slots.push(b);
  if (!S.mine.includes(id)) S.mine.push(id);
  S.lastBooking = id; S.wiz = null; go('mijn');
}

const val = (id) => (document.getElementById(id)?.value ?? '').trim();

async function saveCfg(next, msg) { try { await Store.saveConfig(next); toast(msg); } catch (e) { toast('Opslaan mislukt. Probeer opnieuw.'); } }

document.addEventListener('click', async (e) => {
  const g = e.target.closest('[data-go]'); if (g) { e.preventDefault(); go(g.dataset.go); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act, id = a.dataset.id; const w = S.wiz;
  switch (act) {
    case 'book': startWizard(id); go('boeken'); break;
    case 'book-promo': { const p = (cfg().promos || []).find((x) => x.id === id); startWizard(null, p ? 'Actie: ' + p.title + (p.code ? ' (code ' + p.code + ')' : '') : ''); go('boeken'); break; }
    case 'w-veh': w.vid = id; const sv = cfg().services.find((s) => s.id === w.sid); if (sv && !priceOf(sv, id)) w.sid = null; w.ms = null; render(); break;
    case 'w-svc': w.sid = id; w.ms = null; w.date = null; render(); break;
    case 'w-day': w.date = id; w.ms = null; render(); break;
    case 'w-time': w.ms = +id; w.label = a.dataset.label; render(); break;
    case 'w-back': w.step--; w.err = ''; render(); window.scrollTo({ top: 0 }); break;
    case 'w-next': if (wizValid()) { w.step++; w.err = ''; render(); window.scrollTo({ top: 0 }); } break;
    case 'w-send': sendBooking(); break;
    case 'a-tab': S.adminTab = id; S.sel = null; S.confirming = null; render(); break;
    case 'a-filter': S.adminTab = 'aanvragen'; S.filter = { status: id === 'today' ? '' : id, date: id === 'today' ? ymd() : '', q: '' }; render(); break;
    case 'a-clear': S.filter = { status: '', date: '', q: '' }; render(); break;
    case 'a-open': S.sel = id; S.confirming = null; render(); window.scrollTo({ top: 0 }); break;
    case 'a-close': S.sel = null; S.confirming = null; render(); break;
    case 'a-nostatus': S.confirming = null; render(); break;
    case 'a-status': {
      if ((id === 'afgewezen' || id === 'geannuleerd') && !a.dataset.sure) { S.confirming = { to: id }; render(); break; }
      const s = S.slots.find((x) => x.id === S.sel); if (!NEXT[s.status].includes(id)) break;
      S.confirming = null;
      try { await Store.updateSlot(s.id, { status: id, log: [...(s.log || []), { from: s.status, to: id, at: Date.now() }] }); toast('Status: ' + STATUS[id]); } catch { toast('Wijzigen mislukt.'); }
      render(); break;
    }
    case 'a-unblock': { const n = clone(); n.blocks = (n.blocks || []).filter((b) => b.id !== id); saveCfg(n, 'Blokkering verwijderd'); break; }

    case 'a-seed': saveCfg(JSON.parse(JSON.stringify(DEFAULT_CONFIG)), 'Voorbeeldgegevens geladen'); break;
    case 'a-reset': if (!a.dataset.sure) { S.confirming = { reset: true }; render(); break; } S.confirming = null; S.cfg = JSON.parse(JSON.stringify(DEFAULT_CONFIG)); S.slots = []; S.pii = {}; S.mine = []; saveLocal(); toast('Demo opnieuw begonnen'); break;
  }

document.addEventListener('submit', async (e) => {
  e.preventDefault(); const f = e.target; const id = f.id;
  if (id === 'wform') { if (wizValid()) { S.wiz.step = 4; render(); } return; }
  if (id === 'a-notes') { const s = S.slots.find((x) => x.id === S.sel); try { await Store.savePii(s, { notes: val('a-notes-txt').slice(0, 2000) }); toast('Notitie opgeslagen'); } catch { toast('Opslaan mislukt.'); } return; }
  if (id === 'a-resched') {
    const s = S.slots.find((x) => x.id === S.sel); const ms = toMs(val('rs-date'), val('rs-time'));
    if (ms < Date.now()) { toast('Kies een tijdstip in de toekomst.'); return; }
    const p = slotProblem(cfg(), S.slots, ms, s.minutes, s.id, false); if (p) { toast(ERR[p]); return; }
    try { await Store.updateSlot(s.id, { startMs: ms, endMs: ms + s.minutes * 60000, blockMs: ms + (s.minutes + cfg().rules.buffer) * 60000, log: [...(s.log || []), { from: s.status, to: s.status, at: Date.now(), note: 'verplaatst van ' + dt(s.startMs) }] }); toast('Afspraak verplaatst. Laat het de klant weten.'); } catch { toast('Verplaatsen mislukt.'); }
    render(); return;
  }
  if (id === 'a-services') {
    const n = clone(); let bad = '';
    n.services.forEach((s, i) => {
      s.name = val('sv-name-' + i) || s.name; s.category = val('sv-cat-' + i); s.description = val('sv-desc-' + i); s.active = chk('sv-act-' + i); s.popular = chk('sv-pop-' + i);
      const prices = {};
      n.vehicles.forEach((v) => { const pr = val(`sv-p-${i}-${v.id}`).replace(',', '.'); const du = val(`sv-d-${i}-${v.id}`); if (!pr && !du) return; const c = Math.round(+pr * 100), d = parseInt(du, 10); if (!(c >= 0) || !(d >= 5 && d <= 600) || !pr) { bad = s.name; return; } prices[v.id] = [c, d]; });
      s.prices = prices; if (s.active && !Object.keys(prices).length) bad = s.name;
    });
    if (bad) { toast('Controleer prijs en duur bij "' + bad + '"'); return; }
    saveCfg(n, 'Diensten opgeslagen'); return;
  }
  if (id === 'a-hours') {
    const n = clone(); for (let d = 1; d <= 7; d++) { const fr = val('h-from-' + d), to = val('h-to-' + d); if (chk('h-open-' + d) && minOf(to) <= minOf(fr)) { toast(WEEKDAYS[d - 1] + ': sluitingsuur moet na openingsuur liggen'); return; } n.hours[d] = [chk('h-open-' + d), fr, to]; }
    saveCfg(n, 'Openingsuren opgeslagen'); return;
  }
  if (id === 'a-rules') { const n = clone(); for (const k of ['slot', 'buffer', 'capacity', 'lead', 'maxDays']) n.rules[k] = parseInt(val('r-' + k), 10); saveCfg(n, 'Regels opgeslagen'); return; }
  if (id === 'a-block') {
    const from = val('b-from'), until = val('b-until') || from, t1 = val('b-t1'), t2 = val('b-t2');
    if (!from || until < from) { toast('Kies een geldige periode.'); return; }
    const start = toMs(from, t1 || '00:00'); const end = t1 && t2 ? toMs(until, t2) : toMs(addDays(until, 1), '00:00');
    if (end <= start) { toast('Het einde moet na het begin liggen.'); return; }
    const n = clone(); n.blocks = [...(n.blocks || []), { id: uid(), start, end, reason: val('b-reason') }];
    saveCfg(n, 'Periode geblokkeerd'); return;
  }
  if (f.dataset.promo != null) {
    const i = +f.dataset.promo; const code = val('pr-code-' + i).toUpperCase();
    const p = { id: i < 0 ? uid() : cfg().promos[i].id, title: val('pr-title-' + i), label: val('pr-label-' + i), description: val('pr-desc-' + i), from: val('pr-from-' + i), until: val('pr-until-' + i), code, active: chk('pr-act-' + i), home: chk('pr-home-' + i) };
    if (p.until && p.from && p.until < p.from) { toast('De einddatum ligt voor de startdatum.'); return; }
    const n = clone(); n.promos = n.promos || []; if (i < 0) n.promos.unshift(p); else n.promos[i] = p;
    saveCfg(n, i < 0 ? 'Actie aangemaakt' : 'Actie opgeslagen'); return;
  }
  if (id === 'a-settings') {
    const n = clone(); for (const k of ['name', 'tagline', 'address', 'postal', 'city', 'phone', 'whatsapp', 'email']) n.business[k] = val('st-' + k);
    const ig = val('st-instagram'); n.business.instagram = /^https:\/\//.test(ig) ? ig : ''; n.business.demo = chk('st-demo');
    if (!n.business.name) { toast('Vul de bedrijfsnaam in.'); return; }
    saveCfg(n, 'Instellingen opgeslagen'); return;
  }
});
window.addEventListener('resize', () => document.querySelectorAll('[data-mobile]').forEach((el) => { el.style.display = matchMedia('(min-width: 820px)').matches ? 'none' : 'flex'; }));

readRoute();
render();
boot();
})();
</script>

<script>
/* PWA: service worker + install prompt (works when hosted over HTTPS) */
(() => {
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  let deferred = null;
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent) && !/crios|fxios/i.test(navigator.userAgent);
  function paint() {
    const slot = document.getElementById('install-slot');
    if (!slot || standalone) return;
    if (deferred) slot.innerHTML = '<button class="chip" id="install-btn" style="background:var(--amber);color:var(--amber-ink);border-color:var(--amber);font-weight:700;cursor:pointer">Installeer app</button>';
    else if (isIos && !sessionStorage.getItem('ios-hint-closed')) slot.innerHTML = '<button class="chip" id="ios-hint" style="cursor:pointer">App installeren?</button>';
    else slot.innerHTML = '';
  }
  addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferred = e; paint(); });
  addEventListener('appinstalled', () => { deferred = null; paint(); });
  document.addEventListener('click', async (e) => {
    if (e.target.id === 'install-btn' && deferred) { deferred.prompt(); await deferred.userChoice; deferred = null; paint(); }
    if (e.target.id === 'ios-hint') { e.target.outerHTML = '<span class="small muted">Tik op <b style="color:var(--fg)">Deel</b> &rarr; <b style="color:var(--fg)">Zet op beginscherm</b></span>'; try { sessionStorage.setItem('ios-hint-closed', '1'); } catch {} }
  });
  new MutationObserver(() => { const s = document.getElementById('install-slot'); if (s && !s.innerHTML) paint(); }).observe(document.getElementById('app'), { childList: true });
})();
</script>
